<svg width="680" height="440" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" style="background:#1a1a2e;border-radius:12px">
  <defs>
    <marker id="fwd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#4a9eff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ret" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#4ade80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="int" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6b6b80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="28" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="13" font-weight="600" fill="#94a3b8">Request Lifecycle  ·  SET foo bar</text>

  <!-- Column headers -->
  <rect x="20"  y="40" width="90"  height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="150" y="40" width="100" height="28" rx="6" fill="#0f3460" stroke="#4a9eff"  stroke-width="1"/>
  <rect x="290" y="40" width="100" height="28" rx="6" fill="#2d1b4e" stroke="#a855f7"  stroke-width="1"/>
  <rect x="430" y="40" width="120" height="28" rx="6" fill="#0f3d2e" stroke="#22c55e"  stroke-width="1"/>
  <rect x="590" y="40" width="70"  height="28" rx="6" fill="#3d2000" stroke="#f59e0b"  stroke-width="1.5"/>

  <text x="65"  y="59" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#64748b">Client</text>
  <text x="200" y="59" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#7ec8e3">ClientHandler</text>
  <text x="340" y="59" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#c084fc">RESPParser</text>
  <text x="490" y="59" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#4ade80">CommandHandler</text>
  <text x="625" y="59" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#fbbf24">DataBase</text>

  <!-- Lifelines -->
  <line x1="65"  y1="68" x2="65"  y2="420" stroke="#334155" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="200" y1="68" x2="200" y2="420" stroke="#4a9eff" stroke-width="1" stroke-dasharray="4 3" stroke-opacity="0.4"/>
  <line x1="340" y1="68" x2="340" y2="420" stroke="#a855f7" stroke-width="1" stroke-dasharray="4 3" stroke-opacity="0.4"/>
  <line x1="490" y1="68" x2="490" y2="420" stroke="#22c55e" stroke-width="1" stroke-dasharray="4 3" stroke-opacity="0.4"/>
  <line x1="625" y1="68" x2="625" y2="420" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 3" stroke-opacity="0.4"/>

  <!-- Step row backgrounds alternating -->
  <rect x="0" y="92"  width="680" height="36" fill="#ffffff" fill-opacity="0.015" rx="0"/>
  <rect x="0" y="164" width="680" height="36" fill="#ffffff" fill-opacity="0.015" rx="0"/>
  <rect x="0" y="236" width="680" height="36" fill="#ffffff" fill-opacity="0.015" rx="0"/>
  <rect x="0" y="308" width="680" height="36" fill="#ffffff" fill-opacity="0.015" rx="0"/>
  <rect x="0" y="380" width="680" height="36" fill="#ffffff" fill-opacity="0.015" rx="0"/>

  <!-- ── Step 1: Client → ClientHandler ── -->
  <text x="10" y="106" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" fill="#374151">1</text>
  <line x1="66" y1="110" x2="194" y2="110" stroke="#4a9eff" stroke-width="1.5" marker-end="url(#fwd)"/>
  <text x="130" y="105" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" fill="#4a9eff">*3\r\n$3\r\nSET\r\n...</text>
  <text x="200" y="122" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="8" fill="#334155">recv() → buffer</text>

  <!-- ── Step 2: ClientHandler → RESPParser ── -->
  <text x="10" y="142" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" fill="#374151">2</text>
  <line x1="201" y1="146" x2="334" y2="146" stroke="#6b6b80" stroke-width="1.2" marker-end="url(#int)"/>
  <text x="270" y="141" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" fill="#6b7280">feed(buf, bytes)</text>

  <!-- ── Step 3: RESPParser returns parsed args ── -->
  <text x="10" y="178" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" fill="#374151">3</text>
  <line x1="334" y1="182" x2="201" y2="182" stroke="#a855f7" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#int)"/>
  <text x="270" y="177" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" fill="#a855f7">["SET", "foo", "bar"]</text>
  <text x="340" y="194" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="8" fill="#334155">tryParse() · erases consumed bytes</text>

  <!-- ── Step 4: ClientHandler → CommandHandler ── -->
  <text x="10" y="214" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" fill="#374151">4</text>
  <line x1="201" y1="218" x2="484" y2="218" stroke="#6b6b80" stroke-width="1.2" marker-end="url(#int)"/>
  <text x="342" y="213" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" fill="#6b7280">execute(["SET", "foo", "bar"])</text>

  <!-- ── Step 5: CommandHandler → DataBase ── -->
  <text x="10" y="250" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" fill="#374151">5</text>
  <line x1="491" y1="254" x2="619" y2="254" stroke="#6b6b80" stroke-width="1.2" marker-end="url(#int)"/>
  <text x="555" y="249" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" fill="#6b7280">db.set("foo","bar")</text>
  <text x="625" y="266" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="8" fill="#334155">lock_guard · write</text>

  <!-- ── Step 6: DataBase → CommandHandler (void) ── -->
  <text x="10" y="286" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" fill="#374151">6</text>
  <line x1="619" y1="290" x2="491" y2="290" stroke="#f59e0b" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#int)"/>
  <text x="555" y="285" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" fill="#f59e0b">returns (void)</text>

  <!-- ── Step 7: CommandHandler → ClientHandler (RESP string) ── -->
  <text x="10" y="322" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" fill="#374151">7</text>
  <line x1="484" y1="326" x2="201" y2="326" stroke="#4ade80" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#ret)"/>
  <text x="342" y="321" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" fill="#4ade80">"+OK\r\n"</text>

  <!-- ── Step 8: ClientHandler → Client ── -->
  <text x="10" y="358" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" fill="#374151">8</text>
  <line x1="194" y1="362" x2="66" y2="362" stroke="#4a9eff" stroke-width="1.5" marker-end="url(#fwd)"/>
  <text x="130" y="357" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" fill="#4a9eff">send() → "+OK\r\n"</text>
  <text x="200" y="374" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="8" fill="#334155">loop → next recv()</text>

  <!-- Legend -->
  <line x1="44"  y1="412" x2="74"  y2="412" stroke="#4a9eff" stroke-width="1.5"/>
  <text x="80"  y="416" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" fill="#6b7280">client ↔ server</text>
  <line x1="174" y1="412" x2="204" y2="412" stroke="#4ade80" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="210" y="416" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" fill="#6b7280">return value</text>
  <line x1="294" y1="412" x2="324" y2="412" stroke="#6b6b80" stroke-width="1.2"/>
  <text x="330" y="416" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" fill="#6b7280">internal call</text>
</svg>
