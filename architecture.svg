<svg width="680" height="580" viewBox="0 0 680 580" xmlns="http://www.w3.org/2000/svg" style="background:#0f0f1a;border-radius:12px">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555570" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3a3a50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ── Client (outside server) ── -->
  <rect x="254" y="14" width="172" height="36" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="340" y="28" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" font-weight="600" fill="#8b949e">redis-cli</text>
  <text x="340" y="42" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" fill="#484f58">any Redis client</text>

  <!-- Client → server arrow -->
  <line x1="340" y1="50" x2="340" y2="72" stroke="#555570" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="350" y="65" font-family="ui-monospace,SFMono-Regular,monospace" font-size="8" fill="#3a3a50">TCP connect</text>

  <!-- ── RedisServer outer box ── -->
  <rect x="20" y="72" width="640" height="380" rx="12" fill="#0d1117" stroke="#21262d" stroke-width="1.5"/>
  <!-- header bar -->
  <rect x="20" y="72" width="640" height="32" rx="12" fill="#161b22"/>
  <rect x="20" y="90" width="640" height="14" fill="#161b22"/>
  <circle cx="40" cy="88" r="5" fill="#ff5f57"/>
  <circle cx="56" cy="88" r="5" fill="#febc2e"/>
  <circle cx="72" cy="88" r="5" fill="#28c840"/>
  <text x="340" y="93" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="11" font-weight="600" fill="#a78bfa">RedisServer</text>
  <text x="340" y="107" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" fill="#484f58">socket · bind · listen · accept loop · SIGINT/SIGTERM handler</text>

  <!-- accept → enqueue arrow -->
  <line x1="340" y1="114" x2="340" y2="130" stroke="#555570" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="350" y="125" font-family="ui-monospace,SFMono-Regular,monospace" font-size="8" fill="#3a3a50">accept() → enqueue</text>

  <!-- ── ThreadPool dashed container ── -->
  <rect x="36" y="130" width="608" height="180" rx="8" fill="#0a0a14" stroke="#2a2a3a" stroke-width="1" stroke-dasharray="6 3"/>
  <text x="52" y="148" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" fill="#2a2a4a">ThreadPool  ·  hardware_concurrency() workers  ·  condition_variable task queue</text>

  <!-- ── ClientHandler ── -->
  <rect x="190" y="156" width="300" height="56" rx="8" fill="#0d2149" stroke="#1f6feb" stroke-width="1"/>
  <text x="340" y="179" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" font-weight="600" fill="#58a6ff">ClientHandler</text>
  <text x="340" y="196" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" fill="#1f6feb">owns fd  ·  recv() loop  ·  sendResponse()</text>

  <!-- ClientHandler → RESPParser -->
  <line x1="258" y1="212" x2="180" y2="248" stroke="#555570" stroke-width="1.2" marker-end="url(#arr)"/>
  <!-- ClientHandler → CommandHandler -->
  <line x1="422" y1="212" x2="500" y2="248" stroke="#555570" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- ── RESPParser ── -->
  <rect x="52" y="248" width="248" height="50" rx="8" fill="#1a0d38" stroke="#7c3aed" stroke-width="1"/>
  <text x="176" y="269" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" font-weight="600" fill="#a78bfa">RESPParser</text>
  <text x="176" y="286" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" fill="#7c3aed">feed() · tryParse() · internal buffer</text>

  <!-- return dashed arrow -->
  <path d="M196 248 Q220 232 272 226" fill="none" stroke="#3a3a50" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrd)"/>
  <text x="228" y="225" font-family="ui-monospace,SFMono-Regular,monospace" font-size="8" fill="#3a3a50">vector&lt;string&gt;</text>

  <!-- ── CommandHandler ── -->
  <rect x="380" y="248" width="248" height="50" rx="8" fill="#0a2218" stroke="#238636" stroke-width="1"/>
  <text x="504" y="269" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" font-weight="600" fill="#3fb950">CommandHandler</text>
  <text x="504" y="286" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" fill="#238636">dispatch · execute · RESP encode</text>

  <!-- CommandHandler → DataBase -->
  <line x1="504" y1="298" x2="504" y2="332" stroke="#555570" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="514" y="320" font-family="ui-monospace,SFMono-Regular,monospace" font-size="8" fill="#3a3a50">db.set/get/del()</text>

  <!-- ── DataBase (shared, outside thread pool visually) ── -->
  <rect x="200" y="332" width="390" height="64" rx="8" fill="#271700" stroke="#d29922" stroke-width="1.5"/>
  <text x="395" y="356" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" font-weight="600" fill="#e3b341">DataBase</text>
  <text x="395" y="373" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" fill="#d29922">unordered_map strings · deque lists · unordered_map hashes</text>
  <text x="395" y="388" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="8" fill="#7d5a00">std::mutex  ·  lazy expiry  ·  shared across ALL clients</text>

  <!-- ── Persistence (below DataBase) ── -->
  <line x1="340" y1="452" x2="340" y2="468" stroke="#3a3a50" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrd)"/>

  <!-- persistence box outside server -->
  <rect x="218" y="468" width="244" height="46" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="340" y="487" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" font-weight="600" fill="#8b949e">dump.db</text>
  <text x="340" y="504" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="8" fill="#484f58">load on startup  ·  dump on shutdown  ·  text format</text>

  <!-- DataBase → persistence arrow -->
  <line x1="340" y1="396" x2="340" y2="452" stroke="#3a3a50" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrd)"/>

  <!-- ── Legend ── -->
  <rect x="20" y="530" width="640" height="36" rx="8" fill="#0a0a12"/>
  <rect x="36" y="541" width="10" height="10" rx="2" fill="#0d2149" stroke="#1f6feb" stroke-width="1"/>
  <text x="52" y="550" font-family="ui-monospace,SFMono-Regular,monospace" font-size="8" fill="#484f58">per-connection</text>
  <rect x="150" y="541" width="10" height="10" rx="2" fill="#271700" stroke="#d29922" stroke-width="1.5"/>
  <text x="166" y="550" font-family="ui-monospace,SFMono-Regular,monospace" font-size="8" fill="#484f58">shared · thread-safe</text>
  <rect x="290" y="541" width="10" height="10" rx="2" fill="#0a0a14" stroke="#2a2a3a" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="306" y="550" font-family="ui-monospace,SFMono-Regular,monospace" font-size="8" fill="#484f58">ThreadPool boundary</text>
  <line x1="434" y1="546" x2="454" y2="546" stroke="#3a3a50" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="460" y="550" font-family="ui-monospace,SFMono-Regular,monospace" font-size="8" fill="#484f58">return / persistence</text>
</svg>
