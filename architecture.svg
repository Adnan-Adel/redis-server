<svg width="680" height="560" viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg" style="background:#0f0f1a;border-radius:12px">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555570" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3a3a50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ── Client (outside server) ── -->
  <rect x="254" y="12" width="172" height="36" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="340" y="27" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" font-weight="600" fill="#8b949e">redis-cli</text>
  <text x="340" y="41" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" fill="#484f58">any Redis client</text>

  <!-- Client → server arrow -->
  <line x1="340" y1="48" x2="340" y2="66" stroke="#555570" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="350" y="61" font-family="ui-monospace,SFMono-Regular,monospace" font-size="8" fill="#3a3a50">TCP connect</text>

  <!-- ── RedisServer outer box ── -->
  <rect x="20" y="66" width="640" height="368" rx="12" fill="#0d1117" stroke="#21262d" stroke-width="1.5"/>
  <!-- label at top of box, no fake title bar -->
  <text x="340" y="86" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" font-weight="700" fill="#a78bfa">RedisServer</text>
  <text x="340" y="101" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" fill="#484f58">socket · bind · listen · accept loop · SIGINT/SIGTERM · dumpDatabase()</text>

  <!-- accept arrow down -->
  <line x1="340" y1="106" x2="340" y2="122" stroke="#555570" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="350" y="118" font-family="ui-monospace,SFMono-Regular,monospace" font-size="8" fill="#3a3a50">accept() → enqueue(fd)</text>

  <!-- ── ThreadPool dashed boundary — ONLY wraps ClientHandler ── -->
  <rect x="36" y="120" width="390" height="140" rx="8" fill="#080810" stroke="#2a2a3a" stroke-width="1" stroke-dasharray="6 3"/>
  <text x="52" y="136" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" fill="#2a2a4a">ThreadPool  ·  spawns one ClientHandler task per accepted connection</text>

  <!-- ── ClientHandler (inside ThreadPool) ── -->
  <rect x="56" y="144" width="356" height="100" rx="8" fill="#0d2149" stroke="#1f6feb" stroke-width="1"/>
  <text x="234" y="166" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" font-weight="600" fill="#58a6ff">ClientHandler</text>
  <text x="234" y="183" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" fill="#1f6feb">owns fd · recv() loop · sendResponse()</text>
  <!-- RESPParser member badge -->
  <rect x="74" y="194" width="160" height="18" rx="4" fill="#1a0d38" stroke="#7c3aed" stroke-width="0.8"/>
  <text x="154" y="207" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="8" fill="#a78bfa">RESPParser  (member)</text>
  <text x="250" y="207" font-family="ui-monospace,SFMono-Regular,monospace" font-size="7" fill="#484f58">feed() · tryParse() · owns buffer</text>

  <!-- ClientHandler → CommandHandler -->
  <line x1="412" y1="191" x2="468" y2="191" stroke="#555570" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="440" y="184" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="8" fill="#3a3a50">ref&amp;</text>

  <!-- ── CommandHandler (outside ThreadPool, inside RedisServer) ── -->
  <rect x="470" y="144" width="168" height="114" rx="8" fill="#0a2218" stroke="#238636" stroke-width="1"/>
  <text x="554" y="166" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="11" font-weight="600" fill="#3fb950">CommandHandler</text>
  <text x="554" y="182" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="8" fill="#238636">execute(args) → RESP string</text>
  <text x="554" y="196" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="8" fill="#238636">dispatch · validate · encode</text>
  <line x1="486" y1="205" x2="622" y2="205" stroke="#1a3a20" stroke-width="0.5"/>
  <text x="554" y="218" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="7" fill="#2a4a2a">1 total · owned by RedisServer</text>
  <text x="554" y="231" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="7" fill="#2a4a2a">holds DataBase&amp; · shared ref</text>
  <text x="554" y="244" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="7" fill="#2a4a2a">shared across all clients</text>

  <!-- CommandHandler → DataBase -->
  <line x1="554" y1="258" x2="390" y2="310" stroke="#555570" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="506" y="293" font-family="ui-monospace,SFMono-Regular,monospace" font-size="8" fill="#3a3a50">db.set/get()</text>

  <!-- ── DataBase ── -->
  <rect x="80" y="310" width="440" height="72" rx="8" fill="#271700" stroke="#d29922" stroke-width="1.5"/>
  <text x="300" y="334" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" font-weight="600" fill="#e3b341">DataBase</text>
  <text x="300" y="351" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" fill="#d29922">strings · lists · hashes · expiry  ·  std::mutex (every method locks)</text>
  <text x="300" y="370" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="8" fill="#7d5a00">1 total · owned by RedisServer · all client threads share same instance · non-copyable</text>

  <!-- DataBase → persistence -->
  <line x1="300" y1="382" x2="300" y2="446" stroke="#3a3a50" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrd)"/>
  <text x="312" y="418" font-family="ui-monospace,SFMono-Regular,monospace" font-size="8" fill="#3a3a50">dump / load</text>

  <!-- ── Persistence (outside RedisServer) ── -->
  <rect x="206" y="446" width="188" height="44" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="300" y="464" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" font-weight="600" fill="#8b949e">dump.db</text>
  <text x="300" y="481" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="8" fill="#484f58">load on start · detached thread dumps every 300s</text>

  <!-- ── Legend ── -->
  <rect x="20" y="506" width="640" height="44" rx="8" fill="#080810"/>
  <text x="40" y="522" font-family="ui-monospace,SFMono-Regular,monospace" font-size="8" font-weight="600" fill="#484f58">KEY</text>
  <rect x="62" y="529" width="10" height="10" rx="2" fill="#0d2149" stroke="#1f6feb" stroke-width="1"/>
  <text x="78" y="538" font-family="ui-monospace,SFMono-Regular,monospace" font-size="8" fill="#484f58">one per client thread</text>
  <rect x="212" y="529" width="10" height="10" rx="2" fill="#271700" stroke="#d29922" stroke-width="1.5"/>
  <text x="228" y="538" font-family="ui-monospace,SFMono-Regular,monospace" font-size="8" fill="#484f58">shared · 1 instance total</text>
  <rect x="382" y="529" width="10" height="10" rx="2" fill="#080810" stroke="#2a2a3a" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="398" y="538" font-family="ui-monospace,SFMono-Regular,monospace" font-size="8" fill="#484f58">ThreadPool boundary</text>
  <line x1="528" y1="534" x2="548" y2="534" stroke="#3a3a50" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="554" y="538" font-family="ui-monospace,SFMono-Regular,monospace" font-size="8" fill="#484f58">persistence flow</text>
</svg>
