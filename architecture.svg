<svg width="680" height="500" viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg" style="background:#1a1a2e;border-radius:12px">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6b6b80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#4a4a5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background grid lines subtle -->
  <line x1="0" y1="0" x2="680" y2="0" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

  <!-- ── Outer container: RedisServer ── -->
  <rect x="24" y="16" width="632" height="460" rx="14" fill="#16213e" stroke="#3a3a5c" stroke-width="1"/>
  <rect x="24" y="16" width="632" height="36" rx="14" fill="#1e1e3a"/>
  <rect x="24" y="36" width="632" height="16" fill="#1e1e3a"/>
  <text x="44" y="39" font-family="ui-monospace,SFMono-Regular,monospace" font-size="13" font-weight="600" fill="#a78bfa">RedisServer</text>
  <text x="160" y="39" font-family="ui-monospace,SFMono-Regular,monospace" font-size="11" fill="#6b6b8a">socket · bind · listen · accept loop · signal handler</text>

  <!-- ── ThreadPool container ── -->
  <rect x="44" y="64" width="592" height="220" rx="10" fill="#1a1a30" stroke="#2a2a4a" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="60" y="82" font-family="ui-monospace,SFMono-Regular,monospace" font-size="11" fill="#4a4a6a">ThreadPool  ·  N workers = hardware_concurrency()</text>

  <!-- ClientHandler box -->
  <rect x="190" y="94" width="300" height="60" rx="8" fill="#0f3460" stroke="#4a9eff" stroke-width="1"/>
  <text x="340" y="119" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="13" font-weight="600" fill="#7ec8e3">ClientHandler</text>
  <text x="340" y="137" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#4a9eff">owns fd  ·  read loop  ·  send response</text>

  <!-- Arrow down to two boxes -->
  <line x1="270" y1="154" x2="190" y2="196" stroke="#6b6b80" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="410" y1="154" x2="490" y2="196" stroke="#6b6b80" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- RESPParser box -->
  <rect x="60" y="196" width="240" height="60" rx="8" fill="#2d1b4e" stroke="#a855f7" stroke-width="1"/>
  <text x="180" y="221" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="13" font-weight="600" fill="#c084fc">RESPParser</text>
  <text x="180" y="239" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#a855f7">bytes → vector&lt;string&gt;</text>

  <!-- dashed return arrow -->
  <path d="M190 196 Q210 178 255 170" fill="none" stroke="#4a4a5a" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr2)"/>
  <text x="205" y="172" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" fill="#4a4a6a">parsed args</text>

  <!-- CommandHandler box -->
  <rect x="380" y="196" width="240" height="60" rx="8" fill="#0f3d2e" stroke="#22c55e" stroke-width="1"/>
  <text x="500" y="221" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="13" font-weight="600" fill="#4ade80">CommandHandler</text>
  <text x="500" y="239" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#22c55e">dispatch · execute · encode RESP</text>

  <!-- Arrow CommandHandler → DataBase -->
  <line x1="500" y1="256" x2="500" y2="310" stroke="#6b6b80" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="510" y="290" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" fill="#4a4a6a">db.set() / db.get()</text>

  <!-- ── DataBase box (outside thread pool, shared) ── -->
  <rect x="310" y="316" width="260" height="68" rx="8" fill="#3d2000" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="440" y="343" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="13" font-weight="600" fill="#fbbf24">DataBase</text>
  <text x="440" y="361" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#f59e0b">strings · lists · hashes · expiry · mutex</text>
  <text x="440" y="377" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" fill="#92400e">shared across all clients  ·  thread-safe</text>

  <!-- Persistence arrow -->
  <line x1="310" y1="350" x2="200" y2="400" stroke="#6b6b80" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr2)"/>

  <!-- Persistence box -->
  <rect x="44" y="390" width="240" height="52" rx="8" fill="#1a1f1a" stroke="#374151" stroke-width="1"/>
  <text x="164" y="411" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="11" font-weight="600" fill="#9ca3af">Persistence</text>
  <text x="164" y="430" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" fill="#6b7280">dump.db  ·  load on start  ·  dump on shutdown</text>

  <!-- External client arrow -->
  <line x1="340" y1="64" x2="340" y2="94" stroke="#6b6b80" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="350" y="83" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" fill="#4a4a6a">enqueue(client_fd)</text>

  <!-- Client label at top -->
  <rect x="272" y="20" width="136" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="340" y="37" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#64748b">redis-cli / client</text>

  <!-- Legend -->
  <rect x="44" y="454" width="10" height="10" rx="2" fill="#0f3460" stroke="#4a9eff" stroke-width="1"/>
  <text x="60" y="464" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" fill="#6b7280">per-connection</text>
  <rect x="150" y="454" width="10" height="10" rx="2" fill="#3d2000" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="166" y="464" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" fill="#6b7280">shared singleton</text>
  <rect x="270" y="454" width="10" height="10" rx="2" fill="#16213e" stroke="#2a2a4a" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="286" y="464" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" fill="#6b7280">thread pool boundary</text>
</svg>
